<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Casting Lead Tracker</title>
    <style>
      :root {
        --bg: #11100f;
        --ink: #f7f1e8;
        --muted: #bdb4a8;
        --line: rgba(255, 255, 255, 0.14);
        --panel: rgba(255, 255, 255, 0.07);
        --gold: #d8b36a;
        --teal: #5fb3a8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: linear-gradient(135deg, #14110f, #101416);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(1180px, 92vw);
        margin: 0 auto;
        padding: 42px 0;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 5vw, 4.6rem);
        line-height: 0.98;
      }

      p {
        color: var(--muted);
      }

      .controls {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) repeat(2, minmax(160px, 220px));
        gap: 10px;
        margin: 28px 0 18px;
      }

      input,
      select {
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--ink);
        padding: 0 12px;
      }

      select option {
        color: #11100f;
      }

      .grid {
        display: grid;
        gap: 12px;
      }

      .card {
        display: grid;
        grid-template-columns: 1.1fr 0.8fr 0.9fr;
        gap: 16px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .card h2 {
        margin: 0 0 6px;
        font-size: 1.05rem;
      }

      .tag {
        display: inline-flex;
        margin: 0 6px 6px 0;
        padding: 4px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
      }

      a {
        color: var(--gold);
        overflow-wrap: anywhere;
      }

      .route {
        color: var(--teal);
        font-weight: 800;
      }

      .notes {
        margin: 8px 0 0;
        font-size: 0.92rem;
      }

      @media (max-width: 820px) {
        .controls,
        .card {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Casting Lead Tracker</h1>
      <p>Official submission routes only. Use this to prioritize targeted outreach and avoid sketchy contacts.</p>

      <section class="controls" aria-label="Lead filters">
        <input id="search" type="search" placeholder="Search name, city, fit, notes" />
        <select id="country">
          <option value="all">All countries</option>
        </select>
        <select id="route">
          <option value="all">All routes</option>
          <option value="Email">Email</option>
          <option value="Application form">Application form</option>
        </select>
      </section>

      <section class="grid" id="leadGrid"></section>
    </main>

    <script>
      const leads = [

          route: "Email",

        },
        {

          email: "",
          website: "https://agmodelmanagement.com",
          source: "https://agmodelmanagement.com/contact",
          fit: "Modelling, fashion, ads",
          notes: "Official site says aspiring talent should apply through the form and that applications by email are not accepted.",
        },
        {
          name: "IT Entertainment",
          country: "India",
          city: "Mumbai",
          type: "Casting and talent agency",
          route: "Email",
          email: "casting.itentertainment@gmail.com",
          website: "https://www.itentertainment.in",
          source: "https://www.itentertainment.in/",
          fit: "Actors, models, child artists, ads",
          notes: "Official site says models/actors may email their profile to this address. Verify no fees before proceeding.",
        },
        {
          name: "Mojo Model Agency",
          country: "India",
          city: "Mumbai",
          type: "Model and actor agency",
          route: "Email",
          email: "hola@mojomodelagency.in",
          website: "https://mojomodelagency.in",
          source: "https://mojomodelagency.in/",
          fit: "Models, actors, ads, print, music videos",
          notes: "Official site says model/actor profiles can be shared to this email.",
        },
        {
          name: "IFT Management",
          country: "India",
          city: "Kanpur / Dubai / Malaysia",
          type: "Modeling and casting agency",
          route: "Email",
          email: "iftmanagement.in@gmail.com",
          website: "https://www.iftmanagement.in",
          source: "https://www.iftmanagement.in/",
          fit: "Models, actors, influencers",
          notes: "Official site lists this as the direct advisory/submission email. Verify scope and fees before joining anything.",
        },
        {
          name: "TOABH Creative Agency",
          country: "India",

          type: "Model and artist agency",
          route: "Application form",
          email: "",
          website: "https://toabh.com",
          source: "https://toabh.com/contact-us/",
          fit: "Models, artists, brand work",
          notes: "Official page routes talent submissions through Join Roster/portfolio submission and warns that client enquiry emails reject talent submissions.",
        },
        {
          name: "G Actors Agency",
          country: "Sweden",
          city: "By appointment",
          type: "Actors agency",
          route: "Email",
          email: "representation@gactorsagency.com",
          website: "https://www.gactorsagency.com",
          source: "https://www.gactorsagency.com/contact/",
          fit: "Actor representation",
          notes: "Official page asks for CV, 3 headshots, showreel link, and contact details.",
        },
        {
          name: "Global Talent Agency",
          country: "USA",
          city: "Burbank",
          type: "Talent agency",
          route: "Email",
          email: "submissions@globaltalentagency.com",
          website: "https://www.globaltalentagency.com",
          source: "https://www.globaltalentagency.com/home",
          fit: "Global artist representation",
          notes: "Official page says email submissions and notes they cannot respond to all emails.",
        },
        {
          name: "AHA Talent",
          country: "UK",
          city: "London",
          type: "Talent agency",
          route: "Email",
          email: "submissions@ahatalent.co.uk",
          website: "https://www.ahatalent.co.uk",
          source: "https://www.ahatalent.co.uk/contact/",
          fit: "Actors over 16, UK/Ireland based",
          notes: "Official page says actors can submit material by email; they do not take new clients resident outside UK/Ireland.",
        },
        {
          name: "Act Creative Talent Agency",
          country: "UK",
          city: "London / Manchester",
          type: "Talent agency",
          route: "Email",
          email: "talent@actcreative.agency",
          website: "https://actcreative.agency",
          source: "https://actcreative.agency/join-us/",
          fit: "Screen, commercials, digital media",
          notes: "Official page says applications must be by email and not to send video files, only links.",
        },
        {
          name: "CDA Ltd Actors Agency",
          country: "UK",
          city: "London",
          type: "Actors agency",
          route: "Email",
          email: "representation@cdalondon.com",
          website: "https://cdalondon.com",
          source: "https://cdalondon.com/contact/",
          fit: "Actor representation",
          notes: "Official page accepts representation submissions by email or post; do not turn up in person.",
        },
        {
          name: "Amber Personal Management",
          country: "UK",
          city: "Manchester / London",
          type: "Actors agency",
          route: "Email",
          email: "apply@amberltd.co.uk",
          website: "https://amberltd.co.uk",
          source: "https://amberltd.co.uk/about/",
          fit: "Film, TV, theatre, voiceover",
          notes: "Official page lists a dedicated applications email and looks for trained/experienced actors.",
        },
        {
          name: "Trentin Agency",
          country: "Italy",
          city: "Vicenza",
          type: "International actors agency",
          route: "Email",
          email: "info@trentinagency.com",
          website: "https://trentinagency.com",
          source: "https://trentinagency.com/en/submissions-eng-actors/",
          fit: "Europe-based trained actors",
          notes: "Official page considers trained professional actors based in Europe and selected US actors with European market connection.",
        },
        {
          name: "Commercial Talent Agency",
          country: "USA",
          city: "Los Angeles",
          type: "Commercial and print agency",
          route: "Email",
          email: "submissions@commercialtalentagency.com",
          website: "https://commercialtalentagency.com",
          source: "https://commercialtalentagency.com/submissions",
          fit: "Commercial, print, hosting, VO",
          notes: "Official submissions page accepts adult commercial/print via this email; do not use Google Drive.",
        },
        {
          name: "YOU Management",
          country: "USA / UK / Germany",
          city: "New York / London / Hamburg",
          type: "Talent agency",
          route: "Email",
          email: "Submissions@you-talentagency.com",
          website: "https://www.you-management.com",
          source: "https://www.you-management.com/representation/",
          fit: "US representation",
          notes: "Official page says US applicants can email resume, headshot, and reels to this address; UK uses forms, Germany uses casting@you-management.com.",
        },
        {
          name: "Collective Agents",
          country: "UK",
          city: "London",
          type: "Talent agency",
          route: "Email",
          email: "info@collectiveagents.co.uk",
          website: "https://www.collectiveagents.co.uk",
          source: "https://www.collectiveagents.co.uk/contact",
          fit: "General auditions and castings",
          notes: "Official contact page lists this for general, auditions, and castings; representation has separate page instructions.",
        },
      ];

      const grid = document.getElementById("leadGrid");
      const search = document.getElementById("search");
      const country = document.getElementById("country");
      const route = document.getElementById("route");

      [...new Set(leads.map((lead) => lead.country))].sort().forEach((item) => {
        const option = document.createElement("option");
        option.value = item;
        option.textContent = item;
        country.append(option);
      });

      const render = () => {
        const query = search.value.toLowerCase().trim();
        const selectedCountry = country.value;
        const selectedRoute = route.value;
        const filtered = leads.filter((lead) => {
          const haystack = Object.values(lead).join(" ").toLowerCase();
          return (
            (!query || haystack.includes(query)) &&
            (selectedCountry === "all" || lead.country === selectedCountry) &&
            (selectedRoute === "all" || lead.route === selectedRoute)
          );
        });

        grid.innerHTML = filtered
          .map(
            (lead) => `
              <article class="card">
                <div>
                  <h2>${lead.name}</h2>
                  <span class="tag">${lead.country}</span>
                  <span class="tag">${lead.city}</span>
                  <span class="tag">${lead.type}</span>
                  <p class="notes">${lead.fit}</p>
                </div>
                <div>
                  <div class="route">${lead.route}</div>
                  ${lead.email ? `<a href="mailto:${lead.email}">${lead.email}</a>` : `<a href="${lead.website}" target="_blank" rel="noreferrer">Open application route</a>`}
                  <p class="notes"><a href="${lead.website}" target="_blank" rel="noreferrer">Website</a></p>
                  <p class="notes"><a href="${lead.source}" target="_blank" rel="noreferrer">Source</a></p>
                </div>
                <p class="notes">${lead.notes}</p>
              </article>
            `,
          )
          .join("");
      };

      search.addEventListener("input", render);
      country.addEventListener("change", render);
      route.addEventListener("change", render);
      render();
    </script>
  </body>
</html>
